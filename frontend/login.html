<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PricePath - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card auth-box">
    <h1>PricePath</h1>
    <p class="muted">Find the most economical option across sellers.</p>
    <div id="msg" class="msg"></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" required>
      <button type="submit">Log in</button>
    </form>
    <p>New here? <a href="register.html">Create an account</a></p>
  </div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').onsubmit = async function (event) {
      event.preventDefault();
      try {
        var result = await api('POST', '/api/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        if (result.token) sessionStorage.setItem('pricepathToken', result.token);
        location.href = 'products.html';
      } catch (e) {
        showMsg('msg', e.message, 'error');
      }
    };
  </script>
</body>
</html>
