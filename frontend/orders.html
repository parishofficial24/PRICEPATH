<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PricePath - Orders and Saved Plans</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="msg" class="msg"></div>
    <h1>Orders</h1>
    <table>
      <thead><tr><th>#</th><th>List</th><th>Products</th><th>Discount</th><th>Delivery</th><th>Platform fee</th><th>Final total</th><th>Date</th></tr></thead>
      <tbody id="orders"></tbody>
    </table>

    <h2>Saved plans</h2>
    <div id="saved"></div>
  </div>
  <script src="js/app.js"></script>
  <script>
    async function loadOrders() {
      var orders = await api('GET', '/api/orders');
      var html = '';
      for (var i = 0; i < orders.length; i++) {
        var o = orders[i];
        html += '<tr><td>' + o.orderId + '</td><td>' + esc(o.listName) + '</td><td>' + money(o.totalProductCost)
          + '</td><td>-' + money(o.totalDiscount) + '</td><td>' + money(o.totalDeliveryCharge)
          + '</td><td>' + money(o.totalPlatformFee) + '</td><td><b>' + money(o.finalTotal)
          + '</b></td><td>' + esc(o.createdAt) + '</td></tr>';
      }
      document.getElementById('orders').innerHTML = html || '<tr><td colspan="8">No orders yet.</td></tr>';
    }

    async function loadSaved() {
      var saved = await api('GET', '/api/recommendations/saved');
      var html = '';
      for (var i = 0; i < saved.length; i++) {
        var r = saved[i];
        html += '<div class="card"><h3>' + esc(r.type) + ' <span class="muted">' + esc(r.createdAt) + '</span></h3><table><tbody>';
        for (var j = 0; j < r.items.length; j++) {
          var it = r.items[j];
          html += '<tr><td>' + esc(it.productName) + '</td><td>' + esc(it.sellerName) + '</td><td>' + money(it.recommendedPrice) + '</td></tr>';
        }
        html += '</tbody></table><p class="muted">Sum of unit prices: ' + money(r.itemsTotal) + '</p></div>';
      }
      document.getElementById('saved').innerHTML = html || '<p>No saved plans yet.</p>';
    }

    startPage().then(function () {
      loadOrders().catch(function (e) { showMsg('msg', e.message, 'error'); });
      loadSaved().catch(function (e) { showMsg('msg', e.message, 'error'); });
    });
  </script>
</body>
</html>
