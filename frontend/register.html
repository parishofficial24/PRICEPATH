<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PricePath - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card auth-box">
    <h1>Create account</h1>
    <div id="msg" class="msg"></div>
    <form id="registerForm">
      <label for="name">Name</label>
      <input type="text" id="name" maxlength="100" required>
      <label for="email">Email</label>
      <input type="email" id="email" maxlength="150" required>
      <label for="password">Password (at least 8 characters)</label>
      <input type="password" id="password" minlength="8" required>
      <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="login.html">Log in</a></p>
  </div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').onsubmit = async function (event) {
      event.preventDefault();
      try {
        await api('POST', '/api/auth/register', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        showMsg('msg', 'Registered! Redirecting to login...', 'ok');
        setTimeout(function () { location.href = 'login.html'; }, 1200);
      } catch (e) {
        showMsg('msg', e.message, 'error');
      }
    };
  </script>
</body>
</html>
